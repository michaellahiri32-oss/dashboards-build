# Leads Tracker — runs in the cloud on GitHub's servers, no laptop needed.
# Put this file in the build repo at:  .github/workflows/tracker.yml
name: Leads Tracker

on:
  schedule:
    - cron: '*/10 * * * *'      # every 10 minutes (GitHub may delay a few min under load)
  workflow_dispatch: {}          # lets you run it by hand from the Actions tab

permissions:
  contents: read

concurrency:                     # never let two runs overlap
  group: leads-tracker
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the scripts
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Keeps the phone-number cache + the "already pushed" record between runs,
      # WITHOUT putting customer phone numbers in the public repo (this cache is
      # private to Actions, not part of the repo).
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            customer_phone_cache.json
            .last_github
          key: tracker-cache-${{ github.run_id }}
          restore-keys: |
            tracker-cache-

      - name: Build tracker and publish
        env:
          CXM_CLIENT_ID: ${{ secrets.CXM_CLIENT_ID }}
          CXM_SECRET:    ${{ secrets.CXM_SECRET }}
          CXM_TOKEN:     ${{ secrets.CXM_TOKEN }}
          CXM_ENDPOINT:  ${{ secrets.CXM_ENDPOINT }}
          GITHUB_TOKEN:  ${{ secrets.DATA_PUSH_TOKEN }}   # your existing GitHub token
        run: |
          python build_api.py
          python publish_github.py
